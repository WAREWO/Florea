                <!-- GANTI setiap href="#" di bawah dengan link asli -->
                <div class="mt-24">
                    <!-- Link Google Form pendaftaran single -->
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank" rel="noopener" class="page-item-each py-10 flex-both-center" href="#">

                            <span class="item-title text-center">Register Single</span>
                        </a>
                    </div>
                    <!-- Link Google Form pendaftaran couple (limited) -->
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank" rel="noopener" class="page-item-each py-10 flex-both-center" href="#">
                            <span class="link-each-image link-emoji" aria-hidden="true">🎟️</span>
                            <span class="item-title text-center">Register Couple<small class="item-subtitle">Limited</small></span>

                    </div>

                        </a>

                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank" rel="noopener" class="page-item-each py-10 flex-both-center" href="#">
                            <span class="link-each-image link-emoji" aria-hidden="true">❓</span>

                        </a>
                    </div>
                    <!-- Google Maps Rustic Market, Jl. Golf 1 Surabaya No.159 A, Gn. Sari, Kec. Dukuhpakis, Surabaya, Jawa Timur 60224 -->
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank" rel="noopener" class="page-item-each py-10 flex-both-center" href="https://share.google/X6Z30eaYjZV4WN2lc">
                            <span class="link-each-image link-emoji" aria-hidden="true">📍</span>
                            <span class="item-title text-center">Location<small class="item-subtitle">Rustic Market, Jl. Golf 1 No.159 A, Surabaya</small></span>
                        </a>
                    </div>
                    <!-- CP Humas via WhatsApp: +62 857-3698-6408 -->
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank" rel="noopener" class="page-item-each py-10 flex-both-center" href="https://wa.me/6285736986408?text=Halo%20kak%2C%20saya%20ingin%20bertanya%20tentang%20event%20Florea">
                            <span class="link-each-image link-emoji" aria-hidden="true">📱</span>
